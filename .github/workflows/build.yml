name: Build and Push

on:
  push:
    branches: [github-actions]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (leave empty to build all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '8'
          - '12'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.filter.outputs.build }}
      manifest-versions: ${{ steps.filter.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "build=$(jq -c --arg v "$VERSION" '{include: [.include[] | select(.version == $v)]}' .github/matrix.json)" >> $GITHUB_OUTPUT
            echo "manifest=[\"$VERSION\"]" >> $GITHUB_OUTPUT
          else
            echo "build=$(jq -c . .github/matrix.json)" >> $GITHUB_OUTPUT
            echo 'manifest=["8","12"]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/rochdev/holy-node-box:${{ matrix.tag }}

  manifest:
    needs: [setup, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.manifest-versions) }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create ghcr.io/rochdev/holy-node-box:${{ matrix.version }} \
            ghcr.io/rochdev/holy-node-box:${{ matrix.version }}-amd64 \
            ghcr.io/rochdev/holy-node-box:${{ matrix.version }}-arm64v8
          docker manifest push ghcr.io/rochdev/holy-node-box:${{ matrix.version }}
